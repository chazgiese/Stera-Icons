<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stera Icon Exporter</title>
  <style>
    body {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      background-color: var(--figma-color-bg);
      color: var(--figma-color-text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.6875rem;
      font-style: normal;
      font-weight: 450;
      line-height: 1rem;
      letter-spacing: 0.00344rem;
    }
    .button {
      background-color: var(--figma-color-bg-brand);
      color: var(--figma-color-text);
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .button:hover {
      background-color: var(--figma-color-bg-brand-hover);
    }
    .button-secondary {
      background-color: transparent;
      color: var(--figma-color-text);
      border: 1px solid var(--figma-color-border);
      margin-top: 8px;
    }
    .button-secondary:hover {
      background-color: var(--figma-color-bg-hover);
    }
    .button-secondary .button-content {
      color: var(--figma-color-text);
    }
    .button-content {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--figma-color-text-on-brand);
      font-family: 'Inter', sans-serif;
      font-size: 0.6875rem;
      font-style: normal;
      font-weight: 450;
      line-height: 1rem;
      letter-spacing: 0.00344rem;
    }
    .description {
      margin-top: 20px;
      text-align: center;
      max-width: 240px;
      word-wrap: break-word;
    }
    
    /* Checklist styles */
    #checklist {
      margin-top: 16px;
      width: 100%;
      max-width: 240px;
      display: none;
    }
    
    #checklist.visible {
      display: block;
    }
    
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .check-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    
    .check-icon.running {
      border: 2px solid var(--figma-color-text-secondary);
      border-top-color: var(--figma-color-bg-brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    .check-icon.passed::before {
      content: '✓';
      color: var(--figma-color-text-success);
      font-size: 16px;
      font-weight: bold;
    }
    
    .check-icon.failed::before {
      content: '✕';
      color: var(--figma-color-text-danger);
      font-size: 16px;
      font-weight: bold;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .check-content {
      flex: 1;
      min-width: 0;
    }
    
    .check-label {
      display: block;
      font-size: 0.6875rem;
      line-height: 1rem;
      color: var(--figma-color-text);
      word-wrap: break-word;
    }
    
    .check-message {
      display: block;
      margin-top: 4px;
      font-size: 0.625rem;
      line-height: 0.875rem;
      color: var(--figma-color-text-danger);
      word-wrap: break-word;
    }
    
    .component-list {
      margin: 4px 0 0 0;
      padding-left: 16px;
      list-style-type: disc;
    }
    
    .component-list li {
      margin: 2px 0;
    }
    
    .component-link {
      color: var(--figma-color-text-brand);
      text-decoration: underline;
      cursor: pointer;
    }
    
    .component-link:hover {
      color: var(--figma-color-text-brand-hover);
    }
    
    .fix-button {
      margin-top: 8px;
      padding: 4px 8px;
      font-size: 0.625rem;
      line-height: 0.875rem;
      background-color: var(--figma-color-bg-brand);
      color: var(--figma-color-text-on-brand);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 450;
    }
    
    .fix-button:hover {
      background-color: var(--figma-color-bg-brand-hover);
    }
  </style>
</head>
<body>
  <button id="export-btn" class="button">
    <div class="button-content">
      <span id="button-text">Export Icons</span>
    </div>
  </button>
  
  <button id="precheck-btn" class="button button-secondary">
    <div class="button-content">
      <span id="precheck-button-text">Run Pre-Checks</span>
    </div>
  </button>
  
  <div id="checklist">
    <!-- Check items will be dynamically added here -->
  </div>
  
  <div id="description-text" class="description">
    This plugin will export all components from the current page as a single JSON file with embedded SVG and metadata.
  </div>

  <script>
    const exportBtn = document.getElementById('export-btn');
    const buttonText = document.getElementById('button-text');
    const precheckBtn = document.getElementById('precheck-btn');
    const precheckButtonText = document.getElementById('precheck-button-text');
    const descriptionEl = document.getElementById('description-text');
    const checklistEl = document.getElementById('checklist');
    const originalDescriptionText = 'This plugin will export all components from the current page as a single JSON file with embedded SVG and metadata.';
    const originalButtonText = buttonText ? buttonText.textContent : 'Export Icons';
    const originalPrecheckButtonText = precheckButtonText ? precheckButtonText.textContent : 'Run Pre-Checks';
    
    
    function setButtonExportingState() {
      if (buttonText) {
        buttonText.textContent = 'Exporting icons...';
      }
      exportBtn.classList.add('processing');
      exportBtn.disabled = true;
      precheckBtn.disabled = true;
    }
    
    function setButtonPrecheckingState() {
      if (precheckButtonText) {
        precheckButtonText.textContent = 'Running checks...';
      }
      precheckBtn.classList.add('processing');
      precheckBtn.disabled = true;
      exportBtn.disabled = true;
    }

    function updateDescription(message) {
      if (descriptionEl) {
        descriptionEl.textContent = message;
      }
    }

    function resetDescription() {
      if (descriptionEl) {
        descriptionEl.textContent = originalDescriptionText;
      }
    }
    
    function resetButton() {
      if (buttonText) {
        buttonText.textContent = originalButtonText || 'Export Icons';
      }
      if (precheckButtonText) {
        precheckButtonText.textContent = originalPrecheckButtonText || 'Run Pre-Checks';
      }
      exportBtn.classList.remove('processing');
      exportBtn.disabled = false;
      precheckBtn.classList.remove('processing');
      precheckBtn.disabled = false;
      resetDescription();
    }
    
    function clearChecklist() {
      if (checklistEl) {
        checklistEl.innerHTML = '';
        checklistEl.classList.remove('visible');
      }
    }
    
    function showChecklist() {
      if (checklistEl) {
        checklistEl.classList.add('visible');
      }
    }
    
    function createCheckItem(checkId, label) {
      const itemEl = document.createElement('div');
      itemEl.className = 'check-item';
      itemEl.id = `check-${checkId}`;
      
      const iconEl = document.createElement('span');
      iconEl.className = 'check-icon running';
      
      const contentEl = document.createElement('div');
      contentEl.className = 'check-content';
      
      const labelEl = document.createElement('span');
      labelEl.className = 'check-label';
      labelEl.textContent = label;
      
      contentEl.appendChild(labelEl);
      itemEl.appendChild(iconEl);
      itemEl.appendChild(contentEl);
      
      return itemEl;
    }
    
    function updateCheckItem(checkId, label, passed, message, offendingComponents) {
      const itemEl = document.getElementById(`check-${checkId}`);
      if (!itemEl) return;
      
      const iconEl = itemEl.querySelector('.check-icon');
      const labelEl = itemEl.querySelector('.check-label');
      const contentEl = itemEl.querySelector('.check-content');
      
      // Update icon state
      iconEl.classList.remove('running');
      if (passed) {
        iconEl.classList.add('passed');
      } else {
        iconEl.classList.add('failed');
      }
      
      // Update label
      if (labelEl) {
        labelEl.textContent = label;
      }
      
      // Add error message if failed
      if (!passed && message && offendingComponents && offendingComponents.length > 0) {
        let messageEl = contentEl.querySelector('.check-message');
        if (!messageEl) {
          messageEl = document.createElement('div');
          messageEl.className = 'check-message';
          contentEl.appendChild(messageEl);
        } else {
          messageEl.innerHTML = ''; // Clear previous content
        }
        
        // Parse the message to extract the prefix
        const messageMatch = message.match(/^(.+?)Component sets with errors:/);
        if (messageMatch) {
          const prefix = messageMatch[1].trim();
          if (prefix) {
            const prefixEl = document.createElement('div');
            prefixEl.textContent = prefix;
            messageEl.appendChild(prefixEl);
          }
          
          // Create unordered list for components
          const ul = document.createElement('ul');
          ul.className = 'component-list';
          
          offendingComponents.forEach((comp) => {
            const li = document.createElement('li');
            const link = document.createElement('a');
            link.textContent = comp.name;
            link.href = '#';
            link.className = 'component-link';
            link.onclick = (e) => {
              e.preventDefault();
              parent.postMessage({ 
                pluginMessage: { 
                  type: 'navigate-to-node', 
                  nodeId: comp.id 
                } 
              }, '*');
            };
            li.appendChild(link);
            ul.appendChild(li);
          });
          
          messageEl.appendChild(ul);
          
          // Check if there's a "more" count at the end
          const moreMatch = message.match(/\(and \d+ more\)$/);
          if (moreMatch) {
            const moreEl = document.createElement('div');
            moreEl.textContent = moreMatch[0];
            messageEl.appendChild(moreEl);
          }
        } else {
          messageEl.textContent = message;
        }
        
        // Add fix button for constraints check
        if (checkId === 'constraints') {
          let fixBtn = contentEl.querySelector('.fix-button');
          if (!fixBtn) {
            fixBtn = document.createElement('button');
            fixBtn.className = 'fix-button';
            fixBtn.textContent = 'Fix Constraints';
            fixBtn.onclick = () => {
              parent.postMessage({ pluginMessage: { type: 'fix-constraints' } }, '*');
            };
            contentEl.appendChild(fixBtn);
          }
        }
        // Add fix button for layer names check
        if (checkId === 'layerNames') {
          let fixBtn = contentEl.querySelector('.fix-button');
          if (!fixBtn) {
            fixBtn = document.createElement('button');
            fixBtn.className = 'fix-button';
            fixBtn.textContent = 'Rename to Vector';
            fixBtn.onclick = () => {
              parent.postMessage({ pluginMessage: { type: 'fix-layer-names' } }, '*');
            };
            contentEl.appendChild(fixBtn);
          }
        }
      } else if (!passed && message) {
        let messageEl = contentEl.querySelector('.check-message');
        if (!messageEl) {
          messageEl = document.createElement('div');
          messageEl.className = 'check-message';
          contentEl.appendChild(messageEl);
        }
        messageEl.textContent = message;
      }
    }
    
    exportBtn.addEventListener('click', () => {
      updateDescription('Preparing export...');
      setButtonExportingState();
      clearChecklist(); // Clear checklist on new export
      
      parent.postMessage({ pluginMessage: { type: 'export-icons' } }, '*');
    });
    
    precheckBtn.addEventListener('click', () => {
      updateDescription('Running pre-checks...');
      setButtonPrecheckingState();
      clearChecklist(); // Clear checklist on new check
      
      parent.postMessage({ pluginMessage: { type: 'run-pre-checks' } }, '*');
    });
    
    
    // File download utilities
    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Store files for batch download
    let pendingFiles = [];
    let isDownloading = false;
    let allFilesCollected = false;
    let totalFilesExpected = 0;

    // Listen for messages from the plugin
    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) {
        return; // Ignore non-plugin messages
      }

      console.log('UI received message:', msg.type, msg);
      
      if (msg.type === 'pre-check-start') {
        // Show checklist if hidden, add check item with spinner
        showChecklist();
        const checkItem = createCheckItem(msg.checkId, msg.label);
        checklistEl.appendChild(checkItem);
      } else if (msg.type === 'pre-check-result') {
        // Update check item with result
        updateCheckItem(msg.checkId, msg.label, msg.passed, msg.message, msg.offendingComponents);
      } else if (msg.type === 'pre-checks-complete') {
        // If checks failed, reset button but keep checklist visible
        if (!msg.passed) {
          resetButton();
        }
        // If checks passed, continue with export (button stays in exporting state)
      } else if (msg.type === 'constraints-fixed') {
        // Handle constraints fix result
        const itemEl = document.getElementById('check-constraints');
        if (itemEl) {
          const iconEl = itemEl.querySelector('.check-icon');
          const labelEl = itemEl.querySelector('.check-label');
          const contentEl = itemEl.querySelector('.check-content');
          
          // Update icon to passed
          iconEl.classList.remove('running', 'failed');
          iconEl.classList.add('passed');
          
          // Update label
          if (labelEl) {
            labelEl.textContent = 'Constraints updated to "Scale"';
          }
          
          // Remove error message and fix button, add success summary
          const messageEl = contentEl.querySelector('.check-message');
          const fixBtn = contentEl.querySelector('.fix-button');
          if (messageEl) messageEl.remove();
          if (fixBtn) fixBtn.remove();
          
          // Add success summary
          const summaryEl = document.createElement('div');
          summaryEl.className = 'check-message';
          summaryEl.style.color = 'var(--figma-color-text)';
          
          if (msg.fixedComponents && msg.fixedComponents.length > 0) {
            const summaryText = document.createElement('div');
            summaryText.textContent = 'Updated constraints to "Scale":';
            summaryEl.appendChild(summaryText);
            
            const componentList = msg.fixedComponents
              .map(comp => `${comp.name} (${comp.count} layer${comp.count > 1 ? 's' : ''})`)
              .join(', ');
            
            const listEl = document.createElement('div');
            listEl.textContent = componentList;
            listEl.style.marginTop = '4px';
            summaryEl.appendChild(listEl);
          } else {
            summaryEl.textContent = 'No constraints needed updating.';
          }
          
          contentEl.appendChild(summaryEl);
        }
      } else if (msg.type === 'layer-names-fixed') {
        const itemEl = document.getElementById('check-layerNames');
        if (itemEl) {
          const iconEl = itemEl.querySelector('.check-icon');
          const labelEl = itemEl.querySelector('.check-label');
          const contentEl = itemEl.querySelector('.check-content');

          iconEl.classList.remove('running', 'failed');
          iconEl.classList.add('passed');

          if (labelEl) {
            labelEl.textContent = 'Layer names updated to "Vector"';
          }

          const messageEl = contentEl.querySelector('.check-message');
          const fixBtn = contentEl.querySelector('.fix-button');
          if (messageEl) messageEl.remove();
          if (fixBtn) fixBtn.remove();

          const summaryEl = document.createElement('div');
          summaryEl.className = 'check-message';
          summaryEl.style.color = 'var(--figma-color-text)';

          if (msg.fixedComponents && msg.fixedComponents.length > 0) {
            const summaryText = document.createElement('div');
            summaryText.textContent = 'Renamed to "Vector":';
            summaryEl.appendChild(summaryText);

            const componentList = msg.fixedComponents
              .map(comp => `${comp.name} (${comp.count} layer${comp.count > 1 ? 's' : ''})`)
              .join(', ');

            const listEl = document.createElement('div');
            listEl.textContent = componentList;
            listEl.style.marginTop = '4px';
            summaryEl.appendChild(listEl);
          } else {
            summaryEl.textContent = 'No layer names needed updating.';
          }

          contentEl.appendChild(summaryEl);
        }
      } else if (msg.type === 'success') {
        // Don't show success status - browser download prompt indicates success
        resetButton();
        // Note: checklist remains visible (persistence requirement)
        isDownloading = false;
      } else if (msg.type === 'pre-checks-passed') {
        // Pre-checks completed successfully (checks-only mode)
        resetButton();
        // Checklist remains visible showing all green checks
      } else if (msg.type === 'error') {
        console.error('Export error:', msg.message);
        resetButton();
        // Note: checklist remains visible (persistence requirement)
        isDownloading = false;
      } else if (msg.type === 'status') {
        // Keep button in exporting state; only update description text
        updateDescription(msg.message);
      } else if (msg.type === 'progress') {
        // Keep button in exporting state; only update description text
        updateDescription(msg.message);
      } else if (msg.type === 'save-icons-export') {
        // Download the single JSON file with all icons
        console.log('Downloading icons export JSON file');
        downloadFile(msg.data.content, msg.data.filename, 'application/json');
        // Don't show success status - browser download prompt indicates success
        resetButton();
        // Note: checklist remains visible (persistence requirement)
      }
    };

    // Download all files as individual files with delay
    async function downloadAsZip() {
      console.log(`Downloading ${pendingFiles.length} files individually`);
      
      try {
        // Download each file with a delay to avoid browser blocking
        for (let i = 0; i < pendingFiles.length; i++) {
          const file = pendingFiles[i];
          
          // Create a delay between downloads
          if (i > 0) {
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          
          // Download the file
          downloadFile(file.content, file.filename, file.mimeType);
          console.log(`Downloaded: ${file.filename}`);
        }
        
        console.log(`Downloaded all ${pendingFiles.length} files`);
        
        // Clear pending files
        pendingFiles = [];
      } catch (error) {
        console.error('Failed to download files:', error);
      }
    }
  </script>
</body>
</html>
